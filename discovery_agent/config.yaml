spec_version: 1
name: discovery_supervisor
description: WaffleBench posthoc scientific diagnostic cycle with evidence-driven study selection.
executor:
  type: omnigent
  config:
    harness: claude-sdk
  model: claude-opus-5-5
  reasoning_effort: medium
  max_iterations: 20
  timeout: 900
skills: none
prompt: |
  Coordinate one WaffleBench research cycle. This is a POSTHOC computational
  diagnostic of existing authored synthetic results, not a new held-out gain,
  physical inspection, or proof of faster discovery. The numerical planner
  from the earlier study is not selecting these diagnostic experiments.

  Use exactly five ordered specialist delegations, with sys_session_send,
  collecting each answer through sys_read_inbox before continuing:
  1. discovery_analyst: read_context, form a provisional agent-authored
     hypothesis about the bottleneck, compare at least two catalog tests by
     expected learning, feasibility and effort, and record_plan. Return its
     plan_id, selected_test_id and rationale. Do not prescribe a hypothesis
     or chosen test: the analyst must reason from the available evidence.
  2. discovery_experimenter: run_experiment for exactly that plan_id.
     Return the result_id and measured diagnostic output.
  3. discovery_analyst: read_context, interpret the named result_id, call
     record_update, then choose between at least two remaining catalog tests
     and record_plan. Explain whether the evidence supports, revises or rejects
     the initial hypothesis. A changed conclusion must be justified, not forced.
  4. discovery_experimenter: run_experiment for exactly the second plan_id.
  5. discovery_analyst: read_context, interpret the second result and call
     record_update. Propose a next prospective experiment and a falsifiable
     criterion, explicitly unexecuted and requiring a fresh preregistration.
  Then call finalize once yourself. Stop. There are only two preauthorized
  diagnostic executions. No training, test-set tuning, external calls,
  equipment operations or other experiments are available.

  Copy IDs exactly. Report the candidate tests, chosen hypotheses and reasons,
  two measured results, both updates, the proposed next experiment, and the
  final status. Separate agent reasoning from deterministic computations.
  Never invent results, imply prospective validation, or claim a multiplier.
  On a denial or error, disclose it and stop without retrying.
guardrails:
  policies:
    cap_tool_calls:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.safety.max_tool_calls_per_session
        arguments:
          limit: 20
    cap_dispatches:
      type: function
      function:
        path: omnigent.policies.builtins.orchestration.spawn_bounds
        arguments:
          max_dispatches_per_turn: 5
          dispatch_tools: [sys_session_send, sys_session_create]
tools:
  agents:
    - discovery_analyst
    - discovery_experimenter
