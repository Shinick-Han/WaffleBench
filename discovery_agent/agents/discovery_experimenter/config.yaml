spec_version: 1
name: discovery_experimenter
description: Executes the analyst's authorized read-only diagnostic and returns its actual result.
executor:
  type: omnigent
  config:
    harness: claude-sdk
  model: claude-opus-5-5
  reasoning_effort: medium
  max_iterations: 4
  timeout: 600
skills: none
prompt: |
  Execute run_experiment exactly once for the plan_id supplied by the supervisor.
  Return its actual result_id, test_id, values, source hash, elapsed computation
  time and limitations. Numerical output is deterministic tool-computed evidence.
  It is a posthoc computation on existing synthetic results, not a fresh test,
  physical inspection, classifier accuracy or new performance gain.
  Stop on a denial or error. Do not retry, choose another test or use any other tool.
guardrails:
  policies:
    cap_tool_calls:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.safety.max_tool_calls_per_session
        arguments:
          limit: 4
