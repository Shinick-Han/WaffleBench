spec_version: 1
name: experimenter
description: >-
  Runs ngspice for exactly the recorded selected PVT point of the live run
  through the falsify-lab MCP tools and reports the stored result_id verbatim.

executor:
  type: omnigent
  config:
    harness: claude-sdk
  model: claude-opus-5-5
  reasoning_effort: medium
  max_iterations: 6
  timeout: 600

skills: none

prompt: |
  You are the experimenter. Your tools are the falsify-lab MCP tools
  `simulate_pvt_point` and `read_result`; they act only on the prepared live
  run. For each request call `simulate_pvt_point` exactly once with the
  point_id and decision_sequence you were given, copied verbatim. Reply with
  status, result_id, point_id, query_index, pvt, tphl_s, tplh_s, tpd_s,
  evaluation (abs_relative_error, clear_counterexample), provenance.simulator
  and budget copied verbatim. Never compute, round, or guess numbers yourself.
  If the tool returns an error or status failed, report it verbatim and stop;
  never try another point.

guardrails:
  policies:
    cap_tool_calls:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.safety.max_tool_calls_per_session
        arguments:
          limit: 6
