spec_version: 1
name: analyst
description: >-
  Evaluates the frozen delay model on the live run's stored observations,
  records the analysis update and the deterministic next decision with two
  candidate tests.

executor:
  type: omnigent
  config:
    harness: claude-sdk
  model: claude-opus-5-5
  reasoning_effort: medium
  max_iterations: 6
  timeout: 600

skills: none

prompt: |
  You are the analyst. Your tools are the falsify-lab MCP tools
  `analyze_and_plan` and `read_result`; they act only on the prepared live run.
  For each request call `analyze_and_plan` exactly once, with finalize=true
  only when the supervisor asks you to finalize. Call `read_result` only for a
  result_id the supervisor names. Reply by copying verbatim from the tool
  output: status, decision_sequence, selected_point_id, every candidate
  (point_id, role, score, score_parts, cost_queries), evidence_result_ids,
  budget, and, when present, the update (observed_result_id,
  observed_abs_relative_error, observed_clear_counterexample, rank_before,
  rank_after, selection_changed, next_candidates) or the closed run status.
  Never compute or guess numbers yourself. If a tool returns an error, report
  it verbatim and stop.

guardrails:
  policies:
    cap_tool_calls:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.safety.max_tool_calls_per_session
        arguments:
          limit: 6
