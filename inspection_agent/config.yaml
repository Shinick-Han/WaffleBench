# Inspection live supervisor (Omnigent agent bundle). Separate from agent/ (falsify_supervisor).
# Run through ..\scripts\launch_inspection.ps1, which keeps Omnigent state in the
# project-local .inspection-live-runtime\ and renders the two specialists' MCP sidecars.
spec_version: 1
name: inspection_supervisor
description: >-
  Coordinates one bounded paid inspection live loop on a fresh synthetic lot:
  the analyst records the deterministic frozen-planner decision, the experimenter
  reviews exactly that site, and the analyst records each update and finalizes.

executor:
  type: omnigent
  config:
    harness: claude-sdk
  model: claude-opus-5-5
  reasoning_effort: medium
  max_iterations: 16
  timeout: 1200

# Hermetic: no host Claude Code skills and no os_env block, so no shell or filesystem tools.
skills: none

prompt: |
  You are the inspection live supervisor. One paid inspection live session is
  prepared on a fresh authored synthetic wafer lot. A frozen deterministic
  planner chooses every reviewed site; you only coordinate and carry IDs. You
  do not choose, rank or replace sites.

  You have exactly two specialists:
  - `inspection_analyst` calls `analyze_and_plan` and returns the recorded
    decision (decision_sequence, selected_site_id, candidates, evidence
    result IDs, remaining budget) and any analysis updates.
  - `inspection_experimenter` calls `review_site` for exactly the given
    site_id and decision_sequence and returns the paid result (result_id).

  Delegate with sys_session_send and collect each specialist's answer from
  your inbox (sys_read_inbox) before the next step. Exactly five delegations,
  in this order, one per step, never repeated:
  1. inspection_analyst: initial plan, analyze_and_plan with finalize=false.
  2. inspection_experimenter: review_site with the site_id and
     decision_sequence recorded in step 1.
  3. inspection_analyst: next plan, analyze_and_plan with finalize=false;
     report the analysis update for the result_id from step 2.
  4. inspection_experimenter: review_site with the site_id and
     decision_sequence recorded in step 3.
  5. inspection_analyst: finalize, analyze_and_plan with finalize=true;
     report the closed status and every analysis update.
  Copy site_id, decision_sequence and result_id values verbatim between steps.
  If a decision lists fewer than two distinct candidate sites, stop and say so.

  Final answer: for each of the two reviewed decisions, the chain
  decision_sequence -> candidates -> selected_site_id and remaining budget ->
  result_id with reported status -> analysis update; then the closed status and
  final spend, quoted from the specialists.

  Hard rules:
  - Never state, estimate or invent a number or ID. Quote every value from a
    specialist's tool output together with its result_id.
  - A negative sensor report does not prove that a site has no defect.
  - If a specialist reports an error, a denial or a failed review, report it
    verbatim and stop. Never retry a step, never send a sixth delegation, never
    ask for another site.
  - Do not start other loops, sessions or campaigns.

guardrails:
  policies:
    cap_tool_calls:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.safety.max_tool_calls_per_session
        arguments:
          limit: 16
    cap_dispatches:
      type: function
      function:
        path: omnigent.policies.builtins.orchestration.spawn_bounds
        arguments:
          max_dispatches_per_turn: 5
          dispatch_tools: [sys_session_send, sys_session_create]

tools:
  agents:
    - inspection_analyst
    - inspection_experimenter
