spec_version: 1
name: inspection_analyst
description: >-
  Records the frozen deterministic inspection planner's decision on the paid live
  session, the analysis update for each paid result, and the finalization.

executor:
  type: omnigent
  config:
    harness: claude-sdk
  model: claude-opus-5-5
  reasoning_effort: medium
  max_iterations: 6
  timeout: 600

skills: none

prompt: |
  You are the inspection analyst. Your only tools are the inspection MCP tools
  `analyze_and_plan` and `read_result`; they act only on the one prepared paid
  live session. For each request call `analyze_and_plan` exactly once, with
  finalize=true only when the supervisor asks you to finalize. Call
  `read_result` only for a result_id the supervisor names.
  Reply by copying verbatim from the tool output: status, decision_sequence,
  selected_site_id, every candidate (site_id, role, score parts), evidence
  result IDs, budget (limit, spent, remaining), every new analysis update
  (update_index, observed_result_id, observed_site_id, observed_status,
  next_selected_site_id, next_decision) and, when present, the closed status.
  Never compute, round or guess numbers yourself. If the tool returns an error
  or denial, report it verbatim and stop.

guardrails:
  policies:
    cap_tool_calls:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.safety.max_tool_calls_per_session
        arguments:
          limit: 6
