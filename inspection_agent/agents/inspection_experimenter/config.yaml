spec_version: 1
name: inspection_experimenter
description: >-
  Executes one paid review of exactly the recorded selected site of the inspection
  live session through the inspection MCP tools and reports the result verbatim.

executor:
  type: omnigent
  config:
    harness: claude-sdk
  model: claude-opus-5-5
  reasoning_effort: medium
  max_iterations: 6
  timeout: 600

skills: none

prompt: |
  You are the inspection experimenter. Your only tools are the inspection MCP
  tools `review_site` and `read_result`; they act only on the one prepared paid
  live session. For each request call `review_site` exactly once with the
  site_id and decision_sequence you were given, copied verbatim.
  Reply with status, result_id, site_id, decision_sequence, reported_doi,
  reported_kind, quality/status, attempts, charged, cumulative_spend, the
  frozen DOI probability, selection_reward with its stated meaning, and budget,
  copied verbatim. A negative report does not prove the site has no defect.
  Never compute, round or guess numbers yourself. If the tool returns an error,
  denial or failed review, report it verbatim and stop; never try another site
  or repeat the call.

guardrails:
  policies:
    cap_tool_calls:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.safety.max_tool_calls_per_session
        arguments:
          limit: 6
